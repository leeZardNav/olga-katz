---
layout: default
---
<article class="page">
  <header class="page-head">
    <div class="container">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
    </div>
  </header>
  <div class="container prose">
    {{ content }}
  </div>
</article>
