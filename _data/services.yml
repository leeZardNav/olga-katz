# מה אולגה כץ מצלמת. הקישורים מובילים לגלריות ולמחירונים באתר הרשמי שלה.
- key: bat_mitzvah
  title_he: בוק בת מצווה
  blurb_he: >-
    הלב של העבודה שלה. סטים בסטודיו עם רקעים צבעוניים ושמלות בתנועה, או יום שלם בטבע שנגמר בים בשקיעה.
    סטים מיוחדים לפי הנערה: הארי פוטר, גרפיטי, סוסים, פיות על החוף.
