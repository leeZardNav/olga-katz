- key: themed
  label_he: סטים מיוחדים
  blurb_he: הארי פוטר, גרפיטי, רוק וגראנג'. הסט נבנה סביב מה שהנערה אוהבת.
- key: motion
  label_he: תנועה
  blurb_he: "הפריימים שהיא אוהבת ביותר, במילותיה: בדים באוויר ונערות שרוקדות מול המצלמה."
- key: video
  label_he: וידאו
  blurb_he: השואוריל שלה ורילס מתוך ימי צילום.
