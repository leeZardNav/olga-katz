# הגלריות באתר. הפריטים עצמם בקובץ gallery.yml, לפי key.
- key: bat_mitzvah
  title_he: בוק בת מצווה
  intro_he: >-
    כמעט כל בוק שאני מצלמת מסתיים בים. מתחילים בסטודיו או בשדה, בוחרים שמלה, בונים סט סביב מה שהיא אוהבת,
    וגומרים בחוף דקות אחרי השקיעה.
- key: family
  title_he: צילומי משפחה
  intro_he: >-
    משפחות בסטודיו, בבית ובטבע. אני לא מחפשת את החיוך המושלם, אני מחפשת את הרגע שבו שוכחים שאני שם.
- key: one_year
  title_he: גיל שנה
  intro_he: >-
    השנה הראשונה עוברת בטיסה. יום הולדת ראשון בטבע או בסטודיו, לפעמים עם עוגה, תמיד עם ההורים בפריים.
- key: maternity
  title_he: צילומי הריון
  intro_he: >-
    הרגע שלפני. בסטודיו באור רך או בחוץ בשעת הזהב, לבד, בזוג או עם האחים הגדולים.
- key: feminine
  title_he: נשיות ותדמית
  intro_he: >-
    פורטרטים של נשים, במבט שרואה. לעסק, לעצמך, או סתם כי הגיע הזמן.
- key: generations
  title_he: צילומי דורות
  intro_he: >-
    סבים, סבתות, הורים ונכדים בתמונה אחת. התמונה שתולים בסלון ומסתכלים עליה שנים.
