<div class="fb-embed">
  <div class="fb-post" data-href="{{ include.url }}" data-width="auto" data-show-text="true" data-lazy="true">
    <blockquote cite="{{ include.url }}" class="fb-xfbml-parse-ignore">
      <a href="{{ include.url }}" rel="noopener" target="_blank">{{ include.title | default: 'הפוסט בפייסבוק' }}</a>
    </blockquote>
  </div>
</div>
