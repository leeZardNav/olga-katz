{% assign w = include.work %}
<figure class="embed{% if w.group == 'video' %} embed--video{% endif %}">
  <blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/{{ w.code }}/" data-instgrm-version="14">
    <a href="https://www.instagram.com/p/{{ w.code }}/" rel="noopener" target="_blank">לפוסט באינסטגרם שלי</a>
  </blockquote>
  <figcaption>
    <span>{{ w.caption_he }}</span>
    <a href="https://www.instagram.com/p/{{ w.code }}/" rel="noopener" target="_blank" aria-label="לפוסט המקורי באינסטגרם, {{ w.date }}">{{ w.date }}</a>
  </figcaption>
</figure>
