{% assign g = include.item %}
{% if g.ig %}
<figure class="embed{% if g.video %} embed--video{% endif %}">
  <blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/{{ g.ig }}/" data-instgrm-version="14">
    <a href="https://www.instagram.com/p/{{ g.ig }}/" rel="noopener" target="_blank">לפוסט באינסטגרם שלי</a>
  </blockquote>
  {% if g.caption_he %}<figcaption><span>{{ g.caption_he }}</span>{% if g.date %}<a href="https://www.instagram.com/p/{{ g.ig }}/" rel="noopener" target="_blank">{{ g.date }}</a>{% endif %}</figcaption>{% endif %}
</figure>
{% elsif g.fb %}
<figure class="embed embed--fb">
  {% include fb-post.html url=g.fb title=g.caption_he width=350 height=560 show_text=false %}
  {% if g.caption_he %}<figcaption><span>{{ g.caption_he }}</span>{% if g.date %}<a href="{{ g.fb }}" rel="noopener" target="_blank">{{ g.date }}</a>{% endif %}</figcaption>{% endif %}
</figure>
{% endif %}
